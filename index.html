<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>サロンサイトのサンプル</title>
<style>
  :root { --bg:#f6f3ee; --ink:#2a2622; --muted:#6d665e; --line:#ddd6cb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.8 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font: 500 26px/1.5 "Hiragino Mincho ProN","Yu Mincho",serif; margin: 0 0 8px; letter-spacing:.04em; }
  p.lead { color: var(--muted); margin: 0 0 32px; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li a { display:flex; justify-content:space-between; align-items:center; gap:16px; padding: 20px 4px; border-bottom: 1px solid var(--line); text-decoration:none; color:inherit; }
  li a:hover { background: #fff; }
  li b { display:block; font: 500 19px/1.5 "Hiragino Mincho ProN","Yu Mincho",serif; }
  li span { color: var(--muted); font-size: 13px; }
  li i { font-style: normal; color: var(--muted); }
  .note { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>サロンサイトのサンプル</h1>
  <p class="lead">バンコクのヘアサロン 3 店舗の、提案用のサンプルサイトです（各店の公式サイトではありません）。</p>
  <ul>
    <li><a href="bell/"><div><b>BELL otonagami salon</b><span>プロンポンの大人のためのヘアサロン</span></div><i>→</i></a></li>
    <li><a href="yams/"><div><b>hair &amp; cafe YAMS</b><span>親子で通えるヘアサロン</span></div><i>→</i></a></li>
    <li><a href="rapirabi/"><div><b>Rapi-rabi</b><span>タイ 10 店舗のヘアカラー専門サロン</span></div><i>→</i></a></li>
  </ul>
  <p class="note">各ページの青と黄色の吹き出しは説明用です。URL の末尾に ?notes=0 を付けると吹き出しなしで表示します。</p>
</main>
</body>
</html>
